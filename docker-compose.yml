services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: blazeline-backend

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8000:8000"

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
      "

    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 30s
      timeout: 10s
      retries: 3

    networks:
      - blazeline-network

networks:
  blazeline-network:
    driver: bridge